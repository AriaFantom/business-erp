services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: layerdreams-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Values that are stable across all deploys — secrets and per-deploy
      # config (APP_KEY, APP_URL, AWS_*, S3_ENDPOINT, MINIO_*, POSTGRES_*) come
      # from .env so this file can be committed without leaking credentials.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      TZ: UTC
      SESSION_DRIVER: cookie
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DRIVE_DISK: s3
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      # Bind to loopback only — Nginx Proxy Manager on the host forwards
      # panel.layerdreams.com to 127.0.0.1:3333. The app is never reachable
      # directly from the public internet.
      - '127.0.0.1:3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    container_name: layerdreams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: layerdreams-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: layerdreams-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Public URLs the MinIO server advertises. NPM terminates TLS and
      # forwards s3.layerdreams.com → minio:9000 (API) and
      # s3-console.layerdreams.com → minio:9001 (web console).
      MINIO_SERVER_URL: ${S3_ENDPOINT}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
      # Allow signed-URL fetches from the panel origin in the browser.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL}
    command: server /data --console-address ":9001"
    ports:
      # Loopback-only — NPM proxies the public subdomains to these ports.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  createbuckets:
    image: minio/mc:latest
    container_name: layerdreams-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\" &&
      exit 0
      "
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  backend:
    driver: bridge
