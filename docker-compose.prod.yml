services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: layerdreams-app
    restart: unless-stopped
    env_file:
      # Honor the same file as `docker compose --env-file ...`. Defaults to
      # `.env` so a plain `docker compose -f docker-compose.prod.yml up`
      # behaves like the documented production setup.
      - ${ENV_FILE:-.env}
    environment:
      # Values that are stable across all deploys — secrets and per-deploy
      # config (APP_KEY, APP_URL, AWS_*, MINIO_*, POSTGRES_*) come from .env so
      # this file can be committed without leaking credentials.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      TZ: UTC
      SESSION_DRIVER: cookie
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DRIVE_DISK: s3
      S3_FORCE_PATH_STYLE: 'true'
      # MinIO and InfluxDB are internal-only services reached over the backend
      # network by container hostname. These endpoints are fixed here (not in
      # .env) so they can never be pointed at a public host by mistake.
      S3_ENDPOINT: http://minio:9000
      INFLUX_URL: http://influxdb:8086
      # Emergency escape hatches for raw Compose usage. Normal deployments use
      # deploy.sh, which forces these off and runs a verified backup followed by
      # explicit migration and production-safe seeding steps.
      MIGRATE: ${MIGRATE:-false}
      SEED: ${SEED:-false}
    # The app is the only service that publishes a host port. It binds to the
    # interface:port given by APP_BIND (default 127.0.0.1:3333 — loopback only).
    # Set APP_BIND=0.0.0.0:3333 (or SERVER_IP:3333) to expose it more widely.
    # Anything in front of it (TLS termination, a domain, a reverse proxy) is
    # out of scope of this stack and handled by the operator.
    ports:
      - '${APP_BIND:-127.0.0.1:3333}:3333'
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3333/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    container_name: layerdreams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: layerdreams-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: layerdreams-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    # Internal storage only — no host port binding and no public URLs. The app
    # is the sole client, reaching the S3 API over the backend network at
    # http://minio:9000. All file access flows through the authenticated app;
    # MinIO is never exposed to the browser or the public internet.
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  createbuckets:
    image: minio/mc:latest
    container_name: layerdreams-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\" &&
      exit 0
      "
    networks:
      - backend

  influxdb:
    image: influxdb:2
    container_name: layerdreams-influxdb
    restart: unless-stopped
    # No host port binding — internal-only, reached by the app at
    # http://influxdb:8086 over the backend network.
    #
    # `setup` mode only runs on FIRST boot against an empty volume: it
    # initializes the org/bucket/admin user and mints DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
    # as the all-access token. On subsequent boots (volume already initialized)
    # these vars are ignored. INFLUX_TOKEN must therefore stay stable — changing
    # it will NOT re-key an existing volume and the app will fail to authenticate.
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx_data:/var/lib/influxdb2
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8086/health']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  influx_data:

networks:
  backend:
    driver: bridge
